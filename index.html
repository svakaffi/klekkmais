<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desimaltall</title>

<style>
body {
    font-family: Arial, sans-serif;
    text-align: center;
    background: #f5f5f5;
    padding: 30px;
}

input {
    font-size: 32px;
    width: 180px;
    text-align: center;
    padding: 10px;
    border: 2px solid #444;
    border-radius: 8px;
}

button {
    font-size: 20px;
    padding: 12px 20px;
    margin: 5px;
    border-radius: 8px;
    cursor: pointer;
    border: none;
}

#tall {
    font-size: 60px;
    font-weight: bold;
    margin: 25px;
}


/* KNAPPEOMRÅDE */

.kontroller {
    margin: 20px auto 30px auto;
    max-width: 650px;
}

.knapper {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px;
    margin: 10px 0;
}


/* PLUSS */

.pluss {
    background: #22a447;
    color: white;
    font-weight: bold;
    min-width: 115px;
    border: 2px solid #167a32;
}

.pluss:hover {
    background: #18883a;
}


/* MINUS */

.minus {
    background: #dc3b3b;
    color: white;
    font-weight: bold;
    min-width: 115px;
    border: 2px solid #a51f1f;
}

.minus:hover {
    background: #bd2929;
}


/* VIS-KNAPP */

.vis {
    background: #333;
    color: white;
}


/* NULLSTILL */

.nullstill {
    background: white;
    border: 2px solid #777;
    margin-top: 12px;
}


/* RUTENE */

.container {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    flex-wrap: wrap;
    gap: 40px;
    margin-top: 30px;
}


/* ENERE */

#heleContainer {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
}

.helRute {
    width: 200px;
    height: 200px;
    border: 3px solid #222;
    background: #4285f4;
    box-sizing: border-box;
}


/* DESIMALRUTER */

.rutenett {
    width: 200px;
    height: 200px;
    border: 3px solid #222;
    display: grid;
    background: white;
    box-sizing: border-box;
}


/* TIDELER */

.tidelGrid {
    grid-template-columns: repeat(10, 1fr);
}


/* HUNDREDELER */

.hundredelGrid {
    grid-template-columns: repeat(10, 1fr);
    grid-template-rows: repeat(10, 1fr);
}


/* TUSENDELER */

.tusendelGrid {
    grid-template-columns: repeat(100, 1fr);
    grid-template-rows: repeat(10, 1fr);
}


.celle {
    box-sizing: border-box;
    border: 1px solid #aaa;
    background: white;
}

.markert {
    background: #4285f4;
}

.tusendelGrid .celle {
    border: 0.2px solid #ddd;
}

</style>
</head>

<body>


<input id="inputTall" value="0">

<button
    class="vis"
    onclick="visFraFelt()">
    Vis
</button>


<div id="tall">
    0
</div>


<div class="kontroller">


    <!-- PLUSSKNAPPER -->

    <div class="knapper">

        <button
            class="pluss"
            onclick="leggTil(1000)">
            + 1
        </button>

        <button
            class="pluss"
            onclick="leggTil(100)">
            + 0,1
        </button>

        <button
            class="pluss"
            onclick="leggTil(10)">
            + 0,01
        </button>

        <button
            class="pluss"
            onclick="leggTil(1)">
            + 0,001
        </button>

    </div>


    <!-- MINUSKNAPPER -->

    <div class="knapper">

        <button
            class="minus"
            onclick="trekkFra(1000)">
            − 1
        </button>

        <button
            class="minus"
            onclick="trekkFra(100)">
            − 0,1
        </button>

        <button
            class="minus"
            onclick="trekkFra(10)">
            − 0,01
        </button>

        <button
            class="minus"
            onclick="trekkFra(1)">
            − 0,001
        </button>

    </div>


    <button
        class="nullstill"
        onclick="nullstill()">
        Nullstill
    </button>

</div>


<div class="container">


    <!-- ENERE -->

    <div id="heleContainer"></div>


    <!-- TIDELER -->

    <div
        id="tidelGrid"
        class="rutenett tidelGrid">
    </div>


    <!-- HUNDREDELER -->

    <div
        id="hundredelGrid"
        class="rutenett hundredelGrid">
    </div>


    <!-- TUSENDELER -->

    <div
        id="tusendelGrid"
        class="rutenett tusendelGrid">
    </div>


</div>


<script>

/*
Tallet lagres som tusendeler:

1000 = 1
100  = 0,1
10   = 0,01
1    = 0,001
*/

let verdi = 0;


/* LAG DESIMALRUTENE */

function lagGrid(id, antall) {

    const grid =
        document.getElementById(id);

    for (let i = 0; i < antall; i++) {

        const celle =
            document.createElement("div");

        celle.className = "celle";

        grid.appendChild(celle);
    }
}


lagGrid("tidelGrid", 10);
lagGrid("hundredelGrid", 100);
lagGrid("tusendelGrid", 1000);


/* LAG ENER-RUTER */

function lagHele(antall) {

    const container =
        document.getElementById(
            "heleContainer"
        );

    container.innerHTML = "";

    for (let i = 0; i < antall; i++) {

        const rute =
            document.createElement("div");

        rute.className = "helRute";

        container.appendChild(rute);
    }
}


/* FARGELEGG */

function fargelegg(id, antall) {

    const celler =
        document
        .getElementById(id)
        .children;

    for (let i = 0; i < celler.length; i++) {

        celler[i]
            .classList
            .toggle(
                "markert",
                i < antall
            );
    }
}


/* LEGG TIL */

function leggTil(mengde) {

    verdi += mengde;

    oppdater();
}


/* TREKK FRA */

function trekkFra(mengde) {

    verdi -= mengde;

    if (verdi < 0) {
        verdi = 0;
    }

    oppdater();
}


/* NULLSTILL */

function nullstill() {

    verdi = 0;

    oppdater();
}


/* LES FRA FELT */

function visFraFelt() {

    let input =
        document
        .getElementById("inputTall")
        .value
        .trim()
        .replace(",", ".");

    let tall = Number(input);

    if (
        !Number.isFinite(tall) ||
        tall < 0
    ) {
        return;
    }

    verdi =
        Math.round(tall * 1000);

    oppdater();
}


/* OPPDATER */

function oppdater() {

    const hele =
        Math.floor(verdi / 1000);

    const rest =
        verdi % 1000;

    const tideler =
        Math.floor(rest / 100);

    const hundredeler =
        Math.floor(
            (rest % 100) / 10
        );

    const tusendeler =
        rest % 10;


    /* VIS TALLET */

    let tall =
        (verdi / 1000)
        .toFixed(3);

    tall =
        tall.replace(/0+$/, "");

    tall =
        tall.replace(/\.$/, "");

    tall =
        tall.replace(".", ",");


    document
        .getElementById("tall")
        .textContent = tall;


    document
        .getElementById("inputTall")
        .value = tall;


    /* ENERE */

    lagHele(hele);


    /* TIDELER */

    fargelegg(
        "tidelGrid",
        tideler
    );


    /* HUNDREDELER */

    fargelegg(
        "hundredelGrid",
        hundredeler
    );


    /* TUSENDELER */

    fargelegg(
        "tusendelGrid",
        tusendeler
    );
}


/* ENTER */

document
.getElementById("inputTall")
.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            visFraFelt();

        }
    }
);


oppdater();

</script>

</body>
</html>
